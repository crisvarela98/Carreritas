<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carreritas</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- MENU PRINCIPAL -->
  <div id="menu" class="screen active">
    <h1>🏎️ Carreritas</h1>
    <div class="card">
      <p>Motor: <strong id="engine">1</strong> &nbsp;|&nbsp; Aero: <strong id="aero">1</strong> &nbsp;|&nbsp; Dinero: $<strong id="money">100</strong></p>
    </div>
    <button onclick="goTo('garage')">🔧 Garage</button>
    <button onclick="goTo('qualifying')">🏁 Clasificar</button>
  </div>

  <!-- GARAGE -->
  <div id="garage" class="screen">
    <h1>🔧 Garage</h1>
    <div class="card">
      <p>Dinero: $<strong id="engine">-</strong></p>
      <p style="margin-top:10px">Motor — Nivel <strong id="aero">-</strong></p>
      <button onclick="upgrade('engine')">Mejorar Motor ($50)</button>
      <p style="margin-top:10px">Aerodinámica — Nivel <strong id="money">-</strong></p>
      <button onclick="upgrade('aero')">Mejorar Aero ($50)</button>
    </div>
    <button onclick="goTo('menu')">← Volver</button>
  </div>

  <!-- CLASIFICACIÓN -->
  <div id="qualifying" class="screen">
    <h1>🏁 Clasificación</h1>
    <div class="card">
      <button onclick="qualify()">Hacer vuelta clasificatoria</button>
      <div id="grid"></div>
    </div>
    <div class="card">
      <label for="strategy">Estrategia de carrera:</label><br/>
      <select id="strategy" style="margin:10px;padding:5px;background:#0d1117;color:white;border:1px solid #30363d">
        <option value="safe">Conservadora</option>
        <option value="normal" selected>Normal</option>
        <option value="aggressive">Agresiva</option>
      </select><br/>
      <button onclick="startRace()">🚦 Iniciar Carrera</button>
    </div>
    <button onclick="goTo('menu')">← Volver</button>
  </div>

  <!-- PISTA DE CARRERA -->
  <div id="raceTrack" class="screen">
    <h1>🏎️ En Carrera</h1>
    <div class="track-container">
      <svg viewBox="0 0 500 300">
        <ellipse cx="250" cy="150" rx="200" ry="100" stroke-width="20" stroke="#2ea043" fill="none"/>
      </svg>
      <div id="carsLayer"></div>
    </div>
    <div id="livePositions" class="card"></div>
  </div>

  <script src="game.js"></script>
</body>
</html>
