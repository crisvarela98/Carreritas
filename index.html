<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Motorsport Garage Tycoon</title>
<link rel="stylesheet" href="css/main.css">
</head>
<body>

<header>
    <h1>Motorsport Garage Tycoon</h1>
</header>

<nav>
    <button onclick="showScreen('dashboard')">Inicio</button>
    <button onclick="showScreen('workshop')">Taller</button>
    <button onclick="showScreen('employees')">Staff</button>
    <button onclick="showScreen('sponsors')">Sponsors</button>
    <button onclick="showScreen('race')">Carrera</button>
    <button onclick="showScreen('league')">Liga</button>
</nav>

<main>

<section id="dashboard" class="screen active">
    <div id="dashboardContent"></div>
</section>

<section id="workshop" class="screen">
    <div id="workshopContent"></div>
</section>

<section id="employees" class="screen">
    <div id="employeesContent"></div>
</section>

<section id="sponsors" class="screen">
    <div id="sponsorsContent"></div>
</section>

<section id="race" class="screen">
    <button onclick="runRace()">Correr carrera</button>
</section>

<section id="league" class="screen">
    <div id="leagueContent"></div>
</section>

</main>

<div id="notifications"></div>

<script src="js/core/gameState.js"></script>
<script src="js/core/saveSystem.js"></script>
<script src="js/core/notifications.js"></script>

<script src="js/systems/progression.js"></script>
<script src="js/systems/offline.js"></script>
<script src="js/systems/employees.js"></script>
<script src="js/systems/sponsors.js"></script>
<script src="js/systems/workshop.js"></script>
<script src="js/systems/league.js"></script>
<script src="js/systems/race.js"></script>

<script src="js/app.js"></script>
</body>
</html>
