<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Motorsport Garage Tycoon</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>

<div id="notifications"></div>

<div id="app">

    <!-- Header -->
    <header id="appHeader">
        <div class="header-left">
            <span class="header-logo">🏎</span>
            <span class="header-title">Motorsport Garage Tycoon</span>
        </div>
        <div class="header-right">
            <span class="hdr-coins"   id="hdrCoins">$0</span>
            <span class="hdr-diamonds" id="hdrDiamonds">💎 0</span>
        </div>
    </header>

    <!-- Screens -->
    <main id="mainContent">

        <div class="screen active" id="dashboard">
            <div class="screen-inner" id="dashboardContent"></div>
        </div>

        <div class="screen" id="workshop">
            <div class="screen-inner" id="workshopContent"></div>
        </div>

        <div class="screen" id="race">
            <div class="screen-inner" id="raceContent"></div>
        </div>

        <div class="screen" id="league">
            <div class="screen-inner" id="leagueContent"></div>
        </div>

        <div class="screen" id="employees">
            <div class="screen-inner" id="employeesContent"></div>
        </div>

        <div class="screen" id="sponsors">
            <div class="screen-inner" id="sponsorsContent"></div>
        </div>

        <div class="screen" id="profile">
            <div class="screen-inner" id="profileContent"></div>
        </div>

    </main>

    <!-- Floating Action Buttons -->
    <div class="fab-group">
        <button class="fab-minigame" onclick="MiniGame.open()" title="Minijuego: Camión Ciudad">🚛</button>
        <button class="fab-tasks" id="tasksFab" onclick="openTasksOverlay()" title="Tareas">
            🎯
            <span id="tasksFabBadge" class="fab-badge" style="display:none">0</span>
        </button>
    </div>

    <!-- Bottom Nav -->
    <nav id="mainNav">
        <button data-screen="dashboard" onclick="showScreen('dashboard')" class="nav-active">
            <span class="nav-icon">🏠</span><span class="nav-label">Inicio</span>
        </button>
        <button data-screen="workshop" onclick="showScreen('workshop')">
            <span class="nav-icon">🔧</span><span class="nav-label">Taller</span>
        </button>
        <button data-screen="race" onclick="showScreen('race')">
            <span class="nav-icon">🏁</span><span class="nav-label">Carreras</span>
        </button>
        <button data-screen="employees" onclick="showScreen('employees')">
            <span class="nav-icon">👷</span><span class="nav-label">Staff</span>
        </button>
        <button data-screen="sponsors" onclick="showScreen('sponsors')">
            <span class="nav-icon">🤝</span><span class="nav-label">Sponsors</span>
        </button>
        <button data-screen="profile" onclick="showScreen('profile')">
            <span class="nav-icon">👤</span><span class="nav-label">Perfil</span>
        </button>
    </nav>

</div>

<!-- Tasks overlay (outside #app so it sits above everything) -->
<div id="tasksOverlay" class="tasks-overlay">
    <div class="tasks-overlay-panel">
        <div class="tov-header">
            <span class="tov-title">📋 Tareas</span>
            <button class="tov-close" onclick="closeTasksOverlay()">✕</button>
        </div>
        <div class="tov-tabs">
            <button class="tov-tab tov-tab-active" data-tab="daily" onclick="_setTasksTab('daily')">⏱ Diarias</button>
            <button class="tov-tab" data-tab="super" onclick="_setTasksTab('super')">💎 Súper tareas</button>
        </div>
        <div id="tasksOverlayBody" class="tov-body"></div>
    </div>
</div>

<!-- Mini-game overlay -->
<div id="minigameOverlay" class="minigame-overlay">
    <div class="mg-panel">
        <div class="mg-panel-hdr">
            <button class="mg-close-btn" onclick="MiniGame.close()">✕ Salir</button>
            <span class="mg-panel-title">🚛 CAMIÓN CIUDAD</span>
            <span></span>
        </div>
        <div id="mgGameArea" class="mg-game-area"></div>
    </div>
</div>

<!-- Core -->
<script src="js/core/gameState.js"></script>
<script src="js/core/saveSystem.js"></script>
<script src="js/core/notifications.js"></script>

<!-- Modules -->
<script src="js/modules/economy.js"></script>
<script src="js/modules/vehicles.js"></script>
<script src="js/modules/leagues.js"></script>
<script src="js/modules/upgrades.js"></script>
<script src="js/modules/workshop.js"></script>
<script src="js/modules/races.js"></script>
<script src="js/modules/employees.js"></script>
<script src="js/modules/sponsors.js"></script>
<script src="js/modules/offline.js"></script>
<script src="js/modules/tasks.js"></script>
<script src="js/modules/minigame.js"></script>

<!-- Features -->
<script src="js/features/monetization.js"></script>
<script src="js/features/ftue.js"></script>

<!-- App -->
<script src="js/app.js"></script>

<!-- Header live update -->
<script>
setInterval(() => {
    const c = document.getElementById("hdrCoins");
    const d = document.getElementById("hdrDiamonds");
    if (c) c.textContent = "$" + (game.money || 0).toLocaleString();
    if (d) d.textContent = "💎 " + (game.diamonds || 0);
}, 500);
</script>

</body>
</html>
